name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.7.4
      - run: ruff check api scheduler adapters ontology harvesters --config pyproject.toml

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, scheduler, adapters, ontology, harvesters]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ${{ matrix.package }}/requirements.txt -r ${{ matrix.package }}/requirements-dev.txt
      - name: Run tests
        run: |
          if [ -d "${{ matrix.package }}/tests" ]; then
            python -m pytest ${{ matrix.package }}/tests -q
          else
            (cd ${{ matrix.package }} && python -m pytest -q)
          fi

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui

  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: [lint, test-python, test-ui]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d
      - name: Wait for services healthy
        run: |
          for i in $(seq 1 30); do
            unhealthy=$(docker compose ps --format '{{.Health}}' | grep -v -E '^healthy$|^$' || true)
            exited=$(docker compose ps --format '{{.Service}} {{.State}}' | grep -v -E 'migrate exited|running' || true)
            if [ -z "$unhealthy" ] && [ -z "$exited" ]; then
              echo "all services healthy"
              exit 0
            fi
            sleep 5
          done
          echo "services did not become healthy in time"
          docker compose ps
          docker compose logs
          exit 1
      - name: Check health endpoints
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8001/health
          curl -sf http://localhost:3000/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
